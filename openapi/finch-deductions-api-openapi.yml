          description: The list of frequencies supported by the provider for this benefit
        employee_deduction:
          type: array
          nullable: true
          items:
            type: string
            enum:
            - fixed
            - percent
            - null
          description: Supported deduction types. An empty array indicates deductions are not supported.
        company_contribution:
          type: array
          nullable: true
          items:
            type: string
            enum:
            - fixed
            - percent
