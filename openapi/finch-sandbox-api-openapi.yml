        source: "package com.tryfinch.api.example;\n\nimport com.tryfinch.api.client.FinchClient;\nimport com.tryfinch.api.client.okhttp.FinchOkHttpClient;\nimport com.tryfinch.api.models.CompanyUpdateResponse;\nimport com.tryfinch.api.models.Location;\nimport com.tryfinch.api.models.SandboxCompanyUpdateParams;\n\npublic final class Main {\n    private Main() {}\n\n    public static void main(String[] args) {\n        FinchClient client = FinchOkHttpClient.builder()\n            .fromEnv()\n            .accessToken(\"My Access Token\")\n            .build();\n\n        SandboxCompanyUpdateParams params = SandboxCompanyUpdateParams.builder()\n            .addAccount(SandboxCompanyUpdateParams.Account.builder().build())\n            .addDepartment(SandboxCompanyUpdateParams.Department.builder().build())\n            .ein(\"ein\")\n            .entity(SandboxCompanyUpdateParams.Entity.builder().build())\n            .legalName(\"legal_name\")\n            .addLocation(Location.builder()\n                .city(\"city\")\n                .country(\"country\")\n                .line1(\"line1\")\n                .line2(\"line2\")\n                .postalCode(\"postal_code\")\n                .state(\"state\")\n                .build())\n            .primaryEmail(\"dev@stainless.com\")\n            .primaryPhoneNumber(\"primary_phone_number\")\n            .build();\n        CompanyUpdateResponse company = client.sandbox().company().update(params);\n    }\n}"
      - lang: Kotlin
        source: "package com.tryfinch.api.example\n\nimport com.tryfinch.api.client.FinchClient\nimport com.tryfinch.api.client.okhttp.FinchOkHttpClient\nimport com.tryfinch.api.models.CompanyUpdateResponse\nimport com.tryfinch.api.models.Location\nimport com.tryfinch.api.models.SandboxCompanyUpdateParams\n\nfun main() {\n    val client: FinchClient = FinchOkHttpClient.builder()\n        .fromEnv()\n        .accessToken(\"My Access Token\")\n        .build()\n\n    val params: SandboxCompanyUpdateParams = SandboxCompanyUpdateParams.builder()\n        .addAccount(SandboxCompanyUpdateParams.Account.builder().build())\n        .addDepartment(SandboxCompanyUpdateParams.Department.builder().build())\n        .ein(\"ein\")\n        .entity(SandboxCompanyUpdateParams.Entity.builder().build())\n        .legalName(\"legal_name\")\n        .addLocation(Location.builder()\n            .city(\"city\")\n            .country(\"country\")\n            .line1(\"line1\")\n            .line2(\"line2\")\n            .postalCode(\"postal_code\")\n            .state(\"state\")\n            .build())\n        .primaryEmail(\"dev@stainless.com\")\n        .primaryPhoneNumber(\"primary_phone_number\")\n        .build()\n    val company: CompanyUpdateResponse = client.sandbox().company().update(params)\n}"
      - lang: Ruby
        source: "require \"finch_api\"\n\nfinch = FinchAPI::Client.new(access_token: \"My Access Token\")\n\ncompany = finch.sandbox.company.update(\n  accounts: [{}],\n  departments: [{}],\n  ein: \"ein\",\n  entity: {},\n  legal_name: \"legal_name\",\n  locations: [\n    {city: \"city\", country: \"country\", line1: \"line1\", line2: \"line2\", postal_code: \"postal_code\", state: \"state\"}\n  ],\n  primary_email: \"dev@stainless.com\",\n  primary_phone_number: \"primary_phone_number\"\n)\n\nputs(company)"
  /sandbox/directory:
    post:
      summary: Add new individuals to a sandbox company
      operationId: post-sandbox-directory
      tags:
      - Sandbox
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Array of individuals to create. Takes all combined fields from `/individual` and `/employment` endpoints. All fields are optional.
              items:
                $ref: '#/components/schemas/individual_or_employment'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: The individuals which were created
                items:
                  type: object
