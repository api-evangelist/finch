      operationId: post-sandbox-job
      tags:
      - Sandbox
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: The type of job to start. Currently the only supported type is `data_sync_all`
                  enum:
                  - data_sync_all
              required:
              - type
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                    description: The id of the job that has been created.
                  job_url:
                    type: string
                    description: The url that can be used to retrieve the job status
                  allowed_refreshes:
                    type: integer
                    description: The number of allowed refreshes per hour (per hour, fixed window)
                  remaining_refreshes:
                    type: integer
                    description: The number of remaining refreshes available (per hour, fixed window)
                required:
                - job_id
                - job_url
                - allowed_refreshes
                - remaining_refreshes
              examples:
