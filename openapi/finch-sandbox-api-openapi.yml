  /sandbox/company:
    put:
      summary: Update a sandbox company's data
      operationId: put-sandbox-company
      tags:
      - Sandbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyWithoutId'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyWithoutId'
      x-codeSamples:
      - lang: JavaScript
        source: "import Finch from '@tryfinch/finch-api';\n\nconst client = new Finch({\n  accessToken: 'My Access Token',\n});\n\nconst company = await client.sandbox.company.update({\n  accounts: [{}],\n  departments: [{}],\n  ein: 'ein',\n  entity: {},\n  legal_name: 'legal_name',\n  locations: [\n    {\n      city: 'city',\n      country: 'country',\n      line1: 'line1',\n      line2: 'line2',\n      postal_code: 'postal_code',\n      state: 'state',\n    },\n  ],\n  primary_email: 'dev@stainless.com',\n  primary_phone_number: 'primary_phone_number',\n});\n\nconsole.log(company.accounts);"
      - lang: Python
        source: "from finch import Finch\n\nclient = Finch(\n    access_token=\"My Access Token\",\n)\ncompany = client.sandbox.company.update(\n    accounts=[{}],\n    departments=[{}],\n    ein=\"ein\",\n    entity={},\n    legal_name=\"legal_name\",\n    locations=[{\n        \"city\": \"city\",\n        \"country\": \"country\",\n        \"line1\": \"line1\",\n        \"line2\": \"line2\",\n        \"postal_code\": \"postal_code\",\n        \"state\": \"state\",\n    }],\n    primary_email=\"dev@stainless.com\",\n    primary_phone_number=\"primary_phone_number\",\n)\nprint(company.accounts)"
      - lang: Go
        source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\n\t\"github.com/Finch-API/finch-api-go/v2\"\n\t\"github.com/Finch-API/finch-api-go/v2/option\"\n)\n\nfunc main() {\n\tclient := finchgo.NewClient(\n\t\toption.WithAccessToken(\"My Access Token\"),\n\t)\n\tcompany, err := client.Sandbox.Company.Update(context.TODO(), finchgo.SandboxCompanyUpdateParams{\n\t\tAccounts:    finchgo.F([]finchgo.SandboxCompanyUpdateParamsAccount{{}}),\n\t\tDepartments: finchgo.F([]finchgo.SandboxCompanyUpdateParamsDepartment{{}}),\n\t\tEin:         finchgo.F(\"ein\"),\n\t\tEntity:      finchgo.F(finchgo.SandboxCompanyUpdateParamsEntity{}),\n\t\tLegalName:   finchgo.F(\"legal_name\"),\n\t\tLocations: finchgo.F([]finchgo.LocationParam{{\n\t\t\tCity:       finchgo.F(\"city\"),\n\t\t\tCountry:    finchgo.F(\"country\"),\n\t\t\tLine1:      finchgo.F(\"line1\"),\n\t\t\tLine2:      finchgo.F(\"line2\"),\n\t\t\tPostalCode: finchgo.F(\"postal_code\"),\n\t\t\tState:      finchgo.F(\"state\"),\n\t\t}}),\n\t\tPrimaryEmail:       finchgo.F(\"dev@stainless.com\"),\n\t\tPrimaryPhoneNumber: finchgo.F(\"primary_phone_number\"),\n\t})\n\tif err != nil {\n\t\tpanic(err.Error())\n\t}\n\tfmt.Printf(\"%+v\\n\", company.Accounts)\n}\n"
