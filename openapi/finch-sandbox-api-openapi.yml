openapi: 3.2.0
info:
  title: Reference Sandbox API
  version: '2020-09-17'
  contact: {}
  description: 'The Finch HRIS API provides a unified way to connect to a multitide of HRIS systems. The API requires an access token issued by Finch.


    By default, Organization and Payroll requests use Finch''s Data Syncs. If a request is made before the initial sync has completed, Finch will request data live from the provider. The latency on live requests may range from seconds to minutes depending on the provider and batch size.

    For automated integrations, Deductions requests (both read and write) are always made live to the provider. Latencies may range from seconds to minutes depending on the provider and batch size.


    Employer products are specified by the product parameter, a space-separated list of products that your application requests from an employer authenticating through Finch Connect. Valid product names are—

    - `company`: Read basic company data


    - `directory`: Read company directory and organization structure


    - `individual`: Read individual data, excluding income and employment data


    - `employment`: Read individual employment and income data


    - `payment`: Read payroll and contractor related payments by the company


    - `pay_statement`: Read detailed pay statements for each individual


    - `benefits`: Create and manage deductions and contributions and enrollment for an employer


    ![Open in Postman](https://god.gw.postman.com/run-collection/21027137-08db0929-883d-4094-a9ce-dbf5a9bee4a4?action=collection%2Ffork&collection-url=entityId%3D21027137-08db0929-883d-4094-a9ce-dbf5a9bee4a4%26entityType%3Dcollection%26workspaceId%3D1edf19bc-e0a8-41e9-ac55-481a4b50790b)'
servers:
- url: https://api.tryfinch.com
  description: ''
tags:
- name: Sandbox
paths:
  /sandbox/connections:
    post:
      summary: Create a new Sandbox Connection
      operationId: post-sandbox-connections
      description: Create a new connection (new company/provider pair) with a new account
      tags:
      - Sandbox
      parameters: []
      security:
      - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider_id:
                  type: string
                  description: The provider associated with the connection
                authentication_type:
                  $ref: '#/components/schemas/AuthenticationType'
                products:
                  type: array
                  items:
                    type: string
                employee_size:
                  type: integer
                  description: 'Optional: the size of the employer to be created with this connection. Defaults to 20. Note that if this is higher than 100, historical payroll data will not be generated, and instead only one pay period will be created.'
              required:
              - provider_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSandboxConnectionResponse'
              examples:
                success:
                  value:
                    connection_id: a237a1c3-1a5e-44ae-a8fd-81f76fd715c2
                    entity_id: 449e7a5c-69d3-4b8a-aaaf-5c9b713ebc65
                    company_id: b2e6a1c3-1a5e-44ae-a8fd-81f76fd715cf
                    account_id: 449e7a5c-69d3-4b8a-aaaf-5c9b713ebc65
                    provider_id: gusto
                    authentication_type: api_token
                    products:
                    - company
                    - directory
                    - individual
                    access_token: 7eb55bcf-6593-4040-afac-252ee1f78e20
                    token_type: bearer
      x-codeSamples:
      - lang: JavaScript
        source: "import Finch from '@tryfinch/finch-api';\n\nconst client = new Finch({\n  clientID: process.env['FINCH_CLIENT_ID'], // This is the default and can be omitted\n  clientSecret: process.env['FINCH_CLIENT_SECRET'], // This is the default and can be omitted\n});\n\nconst connection = await client.sandbox.connections.create({ provider_id: 'provider_id' });\n\nconsole.log(connection.account_id);"
      - lang: Python
        source: "import os\nfrom finch import Finch\n\nclient = Finch(\n    client_id=os.environ.get(\"FINCH_CLIENT_ID\"),  # This is the default and can be omitted\n    client_secret=os.environ.get(\"FINCH_CLIENT_SECRET\"),  # This is the default and can be omitted\n)\nconnection = client.sandbox.connections.create(\n    provider_id=\"provider_id\",\n)\nprint(connection.account_id)"
      - lang: Go
        source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\n\t\"github.com/Finch-API/finch-api-go/v2\"\n\t\"github.com/Finch-API/finch-api-go/v2/option\"\n)\n\nfunc main() {\n\tclient := finchgo.NewClient(\n\t\toption.WithClientID(\"4ab15e51-11ad-49f4-acae-f343b7794375\"),\n\t\toption.WithClientSecret(\"My Client Secret\"),\n\t)\n\tconnection, err := client.Sandbox.Connections.New(context.TODO(), finchgo.SandboxConnectionNewParams{\n\t\tProviderID: finchgo.F(\"provider_id\"),\n\t})\n\tif err != nil {\n\t\tpanic(err.Error())\n\t}\n\tfmt.Printf(\"%+v\\n\", connection.AccountID)\n}\n"
      - lang: Java
        source: "package com.tryfinch.api.example;\n\nimport com.tryfinch.api.client.FinchClient;\nimport com.tryfinch.api.client.okhttp.FinchOkHttpClient;\nimport com.tryfinch.api.models.ConnectionCreateResponse;\nimport com.tryfinch.api.models.SandboxConnectionCreateParams;\n\npublic final class Main {\n    private Main() {}\n\n    public static void main(String[] args) {\n        FinchClient client = FinchOkHttpClient.fromEnv();\n\n        SandboxConnectionCreateParams params = SandboxConnectionCreateParams.builder()\n            .providerId(\"provider_id\")\n            .build();\n        ConnectionCreateResponse connection = client.sandbox().connections().create(params);\n    }\n}"
      - lang: Kotlin
        source: "package com.tryfinch.api.example\n\nimport com.tryfinch.api.client.FinchClient\nimport com.tryfinch.api.client.okhttp.FinchOkHttpClient\nimport com.tryfinch.api.models.ConnectionCreateResponse\nimport com.tryfinch.api.models.SandboxConnectionCreateParams\n\nfun main() {\n    val client: FinchClient = FinchOkHttpClient.fromEnv()\n\n    val params: SandboxConnectionCreateParams = SandboxConnectionCreateParams.builder()\n        .providerId(\"provider_id\")\n        .build()\n    val connection: ConnectionCreateResponse = client.sandbox().connections().create(params)\n}"
      - lang: Ruby
        source: 'require "finch_api"


          finch = FinchAPI::Client.new(client_id: "4ab15e51-11ad-49f4-acae-f343b7794375", client_secret: "My Client Secret")


          connection = finch.sandbox.connections.create(provider_id: "provider_id")


          puts(connection)'
  /sandbox/connections/accounts:
    parameters: []
    post:
      summary: Create a new sandbox account
      operationId: post-sandbox-connections-accounts
      description: Create a new account for an existing connection (company/provider pair)
      tags:
      - Sandbox
      security:
      - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: string
                  format: uuid
                provider_id:
                  type: string
                  description: The provider associated with the `access_token`
                authentication_type:
                  $ref: '#/components/schemas/AuthenticationType'
                products:
                  type: array
                  description: Optional, defaults to Organization products (`company`, `directory`, `employment`, `individual`)
                  items:
                    type: string
              required:
              - company_id
              - provider_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection_id:
                    type: string
                    format: uuid
                    description: The ID of the new connection
                  entity_id:
                    type: string
                    format: uuid
                    description: The ID of the entity for this connection
                  company_id:
                    type: string
                    format: uuid
                    description: The Finch UUID of the company associated with the `access_token`.
                  provider_id:
                    type: string
                    description: The ID of the provider associated with the `access_token`
                  account_id:
                    type: string
                    format: uuid
                    deprecated: true
                    description: '[DEPRECATED] Use `connection_id` to associate a connection with an access token'
                  authentication_type:
                    $ref: '#/components/schemas/AuthenticationType'
                  products:
                    type: array
                    items:
                      type: string
                  access_token:
                    type: string
                    format: uuid
                required:
                - connection_id
                - entity_id
                - company_id
                - provider_id
                - account_id
                - authentication_type
                - products
                - access_token
              examples:
                Example 1:
                  value:
                    connection_id: a237a1c3-1a5e-44ae-a8fd-81f76fd715c2
                    entity_id: 449e7a5c-69d3-4b8a-aaaf-5c9b713ebc65
                    company_id: b2e6a1c3-1a5e-44ae-a8fd-81f76fd715cf
                    account_id: 449e7a5c-69d3-4b8a-aaaf-5c9b713ebc65
                    provider_id: gusto
                    authentication_type: credential
                    products:
                    - company
                    access_token: 7eb55bcf-6593-4040-afac-252ee1f78e20
