components:
  schemas:
    CompanyWithoutId:
      type: object
      properties:
        legal_name:
          type: string
          description: The legal name of the company.
          nullable: true
        entity:
          type: object
          description: The entity type object.
          nullable: true
          properties:
            type:
              type: string
              description: The tax payer type of the company.
              enum:
              - llc
              - lp
              - corporation
              - sole_proprietor
              - non_profit
              - partnership
              - cooperative
              - null
              nullable: true
            subtype:
              type: string
              description: The tax payer subtype of the company.
              enum:
              - s_corporation
              - c_corporation
              - b_corporation
              - null
              nullable: true
        primary_email:
          type: string
          description: The email of the main administrator on the account.
          nullable: true
          format: email
        primary_phone_number:
          type: string
          description: 'The phone number of the main administrator on the account. Format: E.164, with extension where applicable, e.g. `+NNNNNNNNNNN xExtension`'
          nullable: true
        departments:
          type: array
          description: The array of company departments.
          nullable: true
          items:
            type: object
            nullable: true
            properties:
              name:
                type: string
                description: The department name.
                nullable: true
              parent:
                type: object
                description: The parent department, if present.
                nullable: true
                properties:
                  name:
                    type: string
                    description: The parent department's name.
                    nullable: true
        ein:
          type: string
          description: The employer identification number.
          nullable: true
        locations:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Location'
        accounts:
          type: array
