  /jobs/automated:
    get:
      summary: List All Automated Jobs
      operationId: get-jobs-automated
      description: Get all automated jobs. Automated jobs are completed by a machine. By default, jobs are sorted in descending order by submission time. For scheduled jobs such as data syncs, only the next scheduled job is shown.
      tags:
      - Management
      parameters:
      - $ref: '#/components/parameters/API-Version'
      - name: limit
        in: query
        description: Number of items to return
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: Index to start from (defaults to 0)
        required: false
        schema:
          type: integer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Job was found
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      quotas:
                        type: object
                        description: Information about remaining quotas for this connection. Only applicable for customers opted in to use Finch's Data Sync Refresh endpoint (`POST /jobs/automated`). Please contact a Finch representative for more details.
                        properties:
                          data_sync_all:
                            type: object
                            properties:
                              allowed_refreshes:
                                type: integer
                              remaining_refreshes:
                                type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutomatedAsyncJob'
                required:
                - meta
                - data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  status:
                    type: integer
                  code:
                    type: integer
                  name:
                    type: string
                  message:
                    type: string
                required:
                - statusCode
                - status
                - code
                - name
                - message
              examples:
                Example 1:
                  value:
                    statusCode: 401
                    status: 401
                    code: 401
                    message: 'Unauthorized request: no authentication given'
                    name: unauthorized_request_error
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  status:
                    type: integer
                  code:
                    type: integer
                  name:
                    type: string
                  message:
                    type: string
                required:
                - statusCode
                - status
                - code
                - name
                - message
              examples:
                Example 1:
                  value:
                    statusCode: 404
                    status: 404
                    code: 404
                    message: could not find job with id job-fb3b25dc-02dc-48eb-9cfc-3f9837276884
                    name: not_found_error
      x-codeSamples:
      - lang: JavaScript
        source: "import Finch from '@tryfinch/finch-api';\n\nconst client = new Finch({\n  accessToken: 'My Access Token',\n});\n\nconst automateds = await client.jobs.automated.list();\n\nconsole.log(automateds.data);"
      - lang: Python
        source: "from finch import Finch\n\nclient = Finch(\n    access_token=\"My Access Token\",\n)\nautomateds = client.jobs.automated.list()\nprint(automateds.data)"
      - lang: Go
        source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\n\t\"github.com/Finch-API/finch-api-go/v2\"\n\t\"github.com/Finch-API/finch-api-go/v2/option\"\n)\n\nfunc main() {\n\tclient := finchgo.NewClient(\n\t\toption.WithAccessToken(\"My Access Token\"),\n\t)\n\tautomateds, err := client.Jobs.Automated.List(context.TODO(), finchgo.JobAutomatedListParams{})\n\tif err != nil {\n\t\tpanic(err.Error())\n\t}\n\tfmt.Printf(\"%+v\\n\", automateds.Data)\n}\n"
      - lang: Java
        source: "package com.tryfinch.api.example;\n\nimport com.tryfinch.api.client.FinchClient;\nimport com.tryfinch.api.client.okhttp.FinchOkHttpClient;\nimport com.tryfinch.api.models.AutomatedListResponse;\nimport com.tryfinch.api.models.JobAutomatedListParams;\n\npublic final class Main {\n    private Main() {}\n\n    public static void main(String[] args) {\n        FinchClient client = FinchOkHttpClient.builder()\n            .fromEnv()\n            .accessToken(\"My Access Token\")\n            .build();\n\n        AutomatedListResponse automateds = client.jobs().automated().list();\n    }\n}"
      - lang: Kotlin
        source: "package com.tryfinch.api.example\n\nimport com.tryfinch.api.client.FinchClient\nimport com.tryfinch.api.client.okhttp.FinchOkHttpClient\nimport com.tryfinch.api.models.AutomatedListResponse\nimport com.tryfinch.api.models.JobAutomatedListParams\n\nfun main() {\n    val client: FinchClient = FinchOkHttpClient.builder()\n        .fromEnv()\n        .accessToken(\"My Access Token\")\n        .build()\n\n    val automateds: AutomatedListResponse = client.jobs().automated().list()\n}"
      - lang: Ruby
        source: 'require "finch_api"


          finch = FinchAPI::Client.new(access_token: "My Access Token")


          automateds = finch.jobs.automated.list


          puts(automateds)'
    post:
      summary: Enqueue a New Automated Job
      operationId: post-jobs-automated
      description: 'Enqueue an automated job.


        `data_sync_all`: Enqueue a job to re-sync all data for a connection. `data_sync_all` has a concurrency limit of 1 job at a time per connection. This means that if this endpoint is called while a job is already in progress for this connection, Finch will return the `job_id` of the job that is currently in progress. Finch allows a fixed window rate limit of 1 forced refresh per hour per connection.


        `w4_form_employee_sync`: Enqueues a job for sync W-4 data for a particular individual, identified by `individual_id`. This feature is currently in beta.


        This endpoint is available for *Scale* tier customers as an add-on. To request access to this endpoint, please contact your Finch account manager.'
      tags:
      - Management
      parameters:
      - $ref: '#/components/parameters/API-Version'
      - $ref: '#/components/parameters/Content-Type'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: data_sync_all
                properties:
                  type:
                    type: string
                    description: The type of job to start.
                    enum:
                    - data_sync_all
                required:
                - type
              - type: object
                title: w4_form_employee_sync
                properties:
                  type:
                    type: string
                    description: The type of job to start.
                    enum:
                    - w4_form_employee_sync
                  params:
                    type: object
                    properties:
                      individual_id:
                        type: string
