                      plan_id: 3f0b5a2b-2b4a-4f4c-9f3e-5c4a2c1d9b70
                      coverage_tier: employee_family
                      coverage_start_date: '2026-01-01'
                      coverage_end_date: null
                      contributions:
                        frequency: per_pay_period
                        employee_contribution:
                          amount: 12500
                          currency: usd
                        employer_contribution:
                          amount: 37500
                          currency: usd
                      dependent_ids:
                      - a8d6c0ec-8a0e-4a2f-9a3b-6f0f6e2b8f21
                      status: active
        '202':
          description: The request has been accepted for processing, but data is not yet available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
              examples:
                DataSyncInProgress:
                  value:
                    code: 202
                    name: sync_in_progress
                    finch_code: data_sync_in_progress
                    message: The data being requested is being fetched. Please check back later.
                AuthorizationPending:
                  value:
                    code: 202
                    name: authorization_pending
                    finch_code: pending
                    message: Authorization to this company's data is pending
                AccountantSetupPending:
                  value:
                    code: 202
                    name: authorization_pending
                    finch_code: accountant_setup_pending
                    message: Finch is still setting up the accountant user for this connection. Please try again later.
        '400':
          description: The request could not be processed due to a validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  name:
                    type: string
                  message:
                    type: string
                  finch_code:
                    type: string
                required:
                - code
                - name
                - message
              examples:
                InvalidQueryParameter:
                  value:
                    code: 400
                    name: bad_request
                    finch_code: invalid_request
                    message: 'Validation error: Expected number, received nan at "limit"'
    post:
      summary: Get Enrollments
      description: '**Beta:** This endpoint is in beta and may change.

        Read enrollments by Finch ID. A maximum of 50 enrollments can be requested at once.'
      operationId: get-plan-enrollments
      tags:
      - Benefits
      parameters:
      - name: entity_ids
        in: query
        required: false
        description: The entity IDs to specify which entities' data to access. Provide exactly one entity ID per request; a maximum of one is accepted.
