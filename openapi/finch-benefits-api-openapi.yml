                      body:
                        code: 404
                        name: not_found_error
                        finch_code: enrollment_not_found
                        message: No enrollment with id 'ec2f4d10-6ad2-4e94-8f2f-4b0a1f3c2d55'
        '202':
          description: The request has been accepted for processing, but data is not yet available
