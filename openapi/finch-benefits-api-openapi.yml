components:
  schemas:
    PlanCoverageTier:
      type: string
      description: 'A coverage tier available on the benefit plan. Known values: `employee_only`, `employee_spouse`, `employee_children`, `employee_family`. Provider-specific values outside this list may also be returned.'
    GetAllPlansResponse:
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanResponse'
          description: The array of benefit plans.
      required:
      - paging
      - plans
    PlanCarrier:
      type: object
      nullable: true
      properties:
        id:
          type: string
          nullable: true
          description: The unique identifier of the insurance carrier.
        name:
          type: string
          nullable: true
          description: The name of the insurance carrier.
      required:
      - id
      - name
      description: The insurance carrier associated with the benefit plan.
    GetAllEnrollmentsResponse:
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentResponse'
